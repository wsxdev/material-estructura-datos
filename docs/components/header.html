<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encabezado de navegación del sitio web de Estructura de Datos">
  <title>Estructura de Datos - Encabezado</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <!-- Header de Navegación -->
  <header>
    <div class="header-container">
      <!-- Logo -->
      <a href="../../index.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7L2 12L12 17L22 12L22 7L12 2Z"></path>
          <path d="M2 12L12 17L22 12"></path>
          <path d="M12 17L12 22"></path>
        </svg>
        <span class="logo-text">Estructura de Datos</span>
      </a>

      <!-- Navegación Principal -->
      <nav>
        <ul>
          <li><a href="../../index.html">Inicio</a></li>
          <li><a href="./about.html">Sobre la Asignatura</a></li>
          <li><a href="#ciclos">Ciclos</a></li>
          <li><a href="./contact.html">Contacto</a></li>
        </ul>
      </nav>

      <!-- Controles del Header -->
      <div class="header-controls">
        <!-- Botón de Tema Claro/Oscuro -->
        <button class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="sun-icon">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="moon-icon" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Botón de Menú Responsive -->
        <button class="menu-toggle" aria-label="Abrir menú" title="Abrir menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <script src="../js/main.js"></script>
</body>
</html>
